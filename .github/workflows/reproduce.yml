name: Research reproduction
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  historical-artifacts:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Fetch pinned SLA input corpus
        run: |
          git init Fission
          git -C Fission remote add origin https://github.com/fission-systems/Fission.git
          git -C Fission sparse-checkout init --cone
          git -C Fission sparse-checkout set utils/sleigh-specs/compiled utils/sleigh-specs/languages utils/signatures
          git -C Fission fetch --depth=1 --filter=blob:none origin 96fc71f75cecdee305faf9497561c577a8955468
          git -C Fission checkout --detach FETCH_HEAD
      - run: make test reproduce
      - run: make migration-reproduce
      - run: make layout-reproduce
      - run: make sla-migration-reproduce
      - name: Reproduce owned asset inventory and library candidates
        run: |
          python3 tools/asset_inventory.py
          cmp artifacts/legacy-assets.json experiments/migration/asset-replacement/legacy-assets.json
          make library-migration-reproduce
      - name: Reproduce x86 source inventory and register declarations
        run: |
          python3 tools/x86_migrate.py --fission-root Fission --output-dir artifacts/x86-specs
          for name in scalar.fslx scalar-bodies.fsl x86-32.fslregs x86-64.fslregs migration.json; do
            cmp "artifacts/x86-specs/$name" "experiments/x86/specs/$name"
          done
      - name: Reproduce readonly x86 memory-source declarations
        run: |
          python3 tools/x86_migrate.py --fission-root Fission --memory-sources --output-dir artifacts/x86-memory-specs
          for name in scalar.fslx scalar-bodies.fsl x86-32.fslregs x86-64.fslregs migration.json; do
            cmp "artifacts/x86-memory-specs/$name" "experiments/x86/memory/specs/$name"
          done
      - name: Reproduce x86 store and stack declarations
        run: |
          python3 tools/x86_migrate.py --fission-root Fission --memory-writes --output-dir artifacts/x86-stateful-specs
          for name in scalar.fslx scalar-bodies.fsl x86-32.fslregs x86-64.fslregs migration.json; do
            cmp "artifacts/x86-stateful-specs/$name" "experiments/x86/stateful/specs/$name"
          done
      - name: Reproduce x86 split displacement/literal declarations
        run: |
          python3 tools/x86_migrate.py --fission-root Fission --memory-immediates --output-dir artifacts/x86-immediate-specs
          for name in scalar.fslx scalar-bodies.fsl x86-32.fslregs x86-64.fslregs migration.json; do
            cmp "artifacts/x86-immediate-specs/$name" "experiments/x86/immediate/specs/$name"
          done
      - name: Preserve reproduction report
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: historical-artifacts-report
          path: |
            artifacts/reproduction.json
            artifacts/register-layout.json
            artifacts/sla-migration.json
            artifacts/library-migration.json
          if-no-files-found: ignore
  sop2-and-fir:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.25.5'
          cache: false
      - name: Fetch pinned experimental compiler
        run: |
          git init .compiler
          git -C .compiler remote add origin https://github.com/fission-systems/Fission.git
          git -C .compiler fetch --depth=1 origin 0fc6f6f98115cddb88077a71353a0462d28b1a0b
          git -C .compiler checkout --detach FETCH_HEAD
      - name: Install encoding oracle
        run: sudo apt-get update && sudo apt-get install -y llvm-18 clang clang-18
      - name: Build and validate FIR execution and recompilation
        working-directory: .compiler
        run: |
          rustup toolchain install 1.98.1 --profile minimal --no-self-update
          cargo +1.98.1 build --locked -p fission-fsl --bin fslc
          cargo +1.98.1 test --locked -p fission-fsl -- --nocapture
      - name: Build owned x86 frontend and reproduce selected spans
        env:
          FISSION_RESOURCE_ROOT: ${{ github.workspace }}/.compiler
        run: |
          cargo +1.98.1 build --manifest-path .compiler/Cargo.toml --locked -p fission-fsl --features x86 --bin fsl-x86
          cmp experiments/x86/specs/scalar.fslx .compiler/crates/fission-fsl/specs/x86/scalar.fslx
          cmp experiments/x86/specs/scalar-bodies.fsl .compiler/crates/fission-fsl/specs/x86/scalar-bodies.fsl
          .compiler/target/debug/fslc check-layout experiments/x86/specs/x86-32.fslregs
          .compiler/target/debug/fslc check-layout experiments/x86/specs/x86-64.fslregs
          python3 tools/x86_reproduce.py --fsl-x86 .compiler/target/debug/fsl-x86 --cc clang-18 --rustc 'rustup run 1.98.1 rustc'
      - name: Preserve owned x86 reproduction evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: owned-x86-report
          path: artifacts/x86-reproduction.json
          if-no-files-found: ignore
      - name: Validate memory-source FIR against recompilation and original x86 execution
        env:
          FISSION_RESOURCE_ROOT: ${{ github.workspace }}/.compiler
        run: |
          cargo +1.98.1 test --manifest-path .compiler/Cargo.toml --locked -p fission-fsl --features x86 --test x86_memory
          cargo +1.98.1 build --manifest-path .compiler/Cargo.toml --locked -p fission-emulator --example x86_fir_baseline
          cmp experiments/x86/memory/specs/scalar-bodies.fsl .compiler/crates/fission-fsl/specs/x86/scalar-memory-bodies.fsl
          python3 tools/x86_semantics_validate.py --fsl-x86 .compiler/target/debug/fsl-x86 --pcode-baseline .compiler/target/debug/examples/x86_fir_baseline --baseline-root .compiler --cc clang-18 --rustc 'rustup run 1.98.1 rustc' --machine-host native-x86
      - name: Preserve x86 semantic comparison evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: x86-semantic-comparison
          path: artifacts/x86-semantics.json
          if-no-files-found: ignore
      - name: Validate ordered stores and stack frames against original x86 execution
        env:
          FISSION_RESOURCE_ROOT: ${{ github.workspace }}/.compiler
        run: |
          cargo +1.98.1 test --manifest-path .compiler/Cargo.toml --locked -p fission-fsl --features x86 --test memory_store --test x86_stateful
          cmp experiments/x86/stateful/specs/scalar.fslx .compiler/crates/fission-fsl/specs/x86/scalar-stateful.fslx
          cmp experiments/x86/stateful/specs/scalar-bodies.fsl .compiler/crates/fission-fsl/specs/x86/scalar-stateful-bodies.fsl
          python3 tools/x86_stateful_validate.py --fsl-x86 .compiler/target/debug/fsl-x86 --pcode-baseline .compiler/target/debug/examples/x86_fir_baseline --baseline-root .compiler --cc clang-18 --rustc 'rustup run 1.98.1 rustc' --machine-host native-x86
      - name: Preserve x86 store and stack execution evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: x86-stateful-comparison
          path: artifacts/x86-stateful.json
          if-no-files-found: ignore
      - name: Validate split operands and C7 stores against original x86 execution
        env:
          FISSION_RESOURCE_ROOT: ${{ github.workspace }}/.compiler
        run: |
          cargo +1.98.1 test --manifest-path .compiler/Cargo.toml --locked -p fission-fsl --features x86 --test x86_immediate
          cmp experiments/x86/immediate/specs/scalar.fslx .compiler/crates/fission-fsl/specs/x86/scalar-immediate.fslx
          cmp experiments/x86/immediate/specs/scalar-bodies.fsl .compiler/crates/fission-fsl/specs/x86/scalar-immediate-bodies.fsl
          python3 tools/x86_stateful_validate.py --fixture-root experiments/x86/immediate --fsl-x86 .compiler/target/debug/fsl-x86 --pcode-baseline .compiler/target/debug/examples/x86_fir_baseline --baseline-root .compiler --cc clang-18 --rustc 'rustup run 1.98.1 rustc' --machine-host native-x86 --report artifacts/x86-immediate.json
      - name: Preserve x86 immediate execution evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: x86-immediate-comparison
          path: artifacts/x86-immediate.json
          if-no-files-found: ignore
      - name: Reproduce checked C/Rust source backend bundles
        run: |
          cargo +1.98.1 test --manifest-path .compiler/Cargo.toml --locked -p fission-fsl --features x86 --test backend
          python3 tools/output_backend_reproduce.py --fsl-x86 .compiler/target/debug/fsl-x86 --cc clang-18 --rustc 'rustup run 1.98.1 rustc'
      - name: Preserve backend admission and compilation evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: output-backend-contract
          path: artifacts/output-backend.json
          if-no-files-found: ignore
      - name: Validate Go against independent state models and C/Rust
        run: |
          cargo +1.98.1 test --manifest-path .compiler/Cargo.toml --locked -p fission-fsl --features x86 --test go_backend
          python3 tools/go_backend_validate.py --fsl-x86 .compiler/target/debug/fsl-x86 --fslc .compiler/target/debug/fslc --cc clang-18 --rustc 'rustup run 1.98.1 rustc'
      - name: Preserve Go execution and source evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: go-backend-contract
          path: artifacts/go-backend.json
          if-no-files-found: ignore
      - name: Reproduce structured FIR and execute native branches
        run: |
          cmp experiments/fir/structured-control/stack-branch-join.fsl .compiler/crates/fission-fsl/specs/stack-branch-join.fsl
          python3 tools/structured_fir_reproduce.py --fslc .compiler/target/debug/fslc
      - name: Reproduce integer conversion and register-state CFG
        run: |
          cmp experiments/fir/register-control/register-branch-convert.fsl .compiler/crates/fission-fsl/specs/register-branch-convert.fsl
          python3 tools/register_fir_reproduce.py --fslc .compiler/target/debug/fslc
      - name: Reproduce sequential FIR state and byte origins
        run: |
          cmp experiments/fir/sequence/amdgcn-gfx900-scalar-sequence.fsl .compiler/crates/fission-fsl/specs/amdgcn-gfx900-scalar-sequence.fsl
          python3 tools/sequence_fir_reproduce.py --fslc .compiler/target/debug/fslc
      - name: Preserve sequence evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: sequence-fir-report
          path: artifacts/sequence-fir.json
          if-no-files-found: ignore
      - name: Preserve register CFG evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: register-fir-report
          path: artifacts/register-fir.json
          if-no-files-found: ignore
      - name: Preserve structured FIR evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: structured-fir-report
          path: artifacts/structured-fir.json
          if-no-files-found: ignore
      - name: Validate CUDA and PTX from the same canonical FIR
        run: |
          cmp experiments/gpu/fir-projections/jvm-iadd.fsl .compiler/crates/fission-fsl/specs/jvm-se26-iadd.fsl
          python3 tools/gpu_projection_toolchain.py
          python3 tools/gpu_projection_validate.py --fslc .compiler/target/debug/fslc --clang clang-18 --ptxas .cuda-toolchain/ptxas
      - name: Preserve GPU projection evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: gpu-projection-report
          path: |
            artifacts/gpu-projection.json
            artifacts/gpu-projection/
          if-no-files-found: ignore
      - name: Verify owned library compiler and native reader
        run: |
          git init .library-input
          git -C .library-input remote add origin https://github.com/fission-systems/Fission.git
          git -C .library-input sparse-checkout init --cone
          git -C .library-input sparse-checkout set utils/signatures/typeinfo/generic
          git -C .library-input fetch --depth=1 --filter=blob:none origin 96fc71f75cecdee305faf9497561c577a8955468
          git -C .library-input checkout --detach FETCH_HEAD
          python3 tools/library_migration_reproduce.py --fission-root .library-input --fslc .compiler/target/debug/fslc
          python3 tools/fsl_library_migrate.py --library-source .compiler/crates/fission-fsl/specs/library-candidates.fslib --output-dir artifacts/library-fixture
          cmp artifacts/library-fixture/library.fsldb .compiler/crates/fission-fsl/specs/library-candidates.fsldb
          .compiler/target/debug/fslc library-query artifacts/library-fixture/library.fsldb beta
      - name: Preserve library reader evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: library-reader-report
          path: artifacts/library-migration.json
          if-no-files-found: ignore
      - name: Verify migrated source copies and ABI metadata
        run: |
          for name in ebpf-add64-register.fsl bpf.fslabi ebpf.fslabi; do
            cmp "experiments/migration/first-slice/$name" ".compiler/crates/fission-fsl/specs/$name"
          done
          .compiler/target/debug/fslc check-abi experiments/migration/first-slice/ebpf.fslabi
          .compiler/target/debug/fslc check-abi experiments/migration/first-slice/bpf.fslabi
      - name: Verify register layout copies and ABI linking
        run: |
          git init .layout-input
          git -C .layout-input remote add origin https://github.com/fission-systems/Fission.git
          git -C .layout-input sparse-checkout init --cone
          git -C .layout-input sparse-checkout set utils/sleigh-specs/languages
          git -C .layout-input fetch --depth=1 --filter=blob:none origin 96fc71f75cecdee305faf9497561c577a8955468
          git -C .layout-input checkout --detach FETCH_HEAD
          for name in bpf.le.registers.fslregs ebpf.le.registers.fslregs ebpf.be.registers.fslregs; do
            cmp "experiments/migration/register-layout/$name" ".compiler/crates/fission-fsl/specs/$name"
          done
          python3 tools/register_layout_reproduce.py --fission-root .layout-input --fslc .compiler/target/debug/fslc
      - name: Preserve register layout report
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: register-layout-report
          path: artifacts/register-layout.json
          if-no-files-found: ignore
      - name: Migrate SLA with no Sleigh source grammar available
        run: |
          git init .sla-input
          git -C .sla-input remote add origin https://github.com/fission-systems/Fission.git
          git -C .sla-input sparse-checkout init --cone
          git -C .sla-input sparse-checkout set utils/sleigh-specs/compiled
          git -C .sla-input fetch --depth=1 --filter=blob:none origin 96fc71f75cecdee305faf9497561c577a8955468
          git -C .sla-input checkout --detach FETCH_HEAD
          test ! -d .sla-input/utils/sleigh-specs/languages
          for name in ebpf-sla-add64-register.fsl ebpf.le.sla.registers.fslregs; do
            cmp "experiments/migration/sla-first-slice/$name" ".compiler/crates/fission-fsl/specs/$name"
          done
          python3 tools/sla_migration_reproduce.py --fission-root .sla-input --fslc .compiler/target/debug/fslc
      - name: Preserve SLA migration report
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: sla-migration-report
          path: artifacts/sla-migration.json
          if-no-files-found: ignore
      - name: Compare SOP2 decode and reencoding against LLVM
        run: python3 tools/gfx900_sop2_validate.py --fslc .compiler/target/debug/fslc --llvm-mc llvm-mc-18 --llvm-objdump llvm-objdump-18
      - name: Verify wave source copy and compare VOP2 encodings
        run: |
          cmp specs/gpu/amdgcn/gfx900-vadd-u32-wave64.fsl .compiler/crates/fission-fsl/specs/amdgcn-gfx900-vadd-u32-wave64.fsl
          python3 tools/gfx900_wave_validate.py --fslc .compiler/target/debug/fslc --llvm-mc llvm-mc-18
          python3 tools/gfx900_wave_kernel_probe.py --fslc .compiler/target/debug/fslc --llvm-llc llc-18 --llvm-objdump llvm-objdump-18
      - name: Preserve wave report
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: gfx900-wave-report
          path: |
            artifacts/gfx900-wave.json
            artifacts/gfx900-wave-kernel.json
          if-no-files-found: ignore
      - name: Preserve SOP2 report
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: gfx900-sop2-report
          path: artifacts/gfx900-sop2.json
          if-no-files-found: ignore

  owned-fsl-pipeline:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.25.5'
          cache: false
      - name: Fetch compiler source without legacy asset trees
        run: |
          git init .owned-compiler
          git -C .owned-compiler remote add origin https://github.com/fission-systems/Fission.git
          git -C .owned-compiler sparse-checkout init --cone
          git -C .owned-compiler sparse-checkout set crates .cargo
          git -C .owned-compiler fetch --depth=1 --filter=blob:none origin 0fc6f6f98115cddb88077a71353a0462d28b1a0b
          git -C .owned-compiler checkout --detach FETCH_HEAD
          test ! -e .owned-compiler/utils
          test ! -e .owned-compiler/vendor
          if find .owned-compiler -type f | rg '\.(sla|slaspec|sinc|cspec|pspec|ldefs|opinion|fpk|fidb)$'; then exit 1; fi
      - name: Build the owned pipeline without legacy assets
        run: |
          rustup toolchain install 1.98.1 --profile minimal --no-self-update
          cargo +1.98.1 build --manifest-path .owned-compiler/Cargo.toml --locked -p fission-fsl --features x86 --bin fsl-x86
          cargo +1.98.1 test --manifest-path .owned-compiler/Cargo.toml --locked -p fission-fsl --features x86 --test pipeline
          cargo +1.98.1 test --manifest-path .owned-compiler/Cargo.toml --locked -p fission-loader format_facts
      - name: Check static DecBench adapter and owned entry fixture admission
        env:
          FSL_X86: ${{ github.workspace }}/.owned-compiler/target/debug/fsl-x86
        run: python3 -m unittest discover -s tests -p test_decbench_fsl_evalkit.py -v
      - name: Reproduce in a filesystem without legacy assets
        run: |
          sudo apt-get update && sudo apt-get install -y strace clang-18
          python3 tools/owned_pipeline_reproduce.py --compiler-root .owned-compiler --fsl-x86 .owned-compiler/target/debug/fsl-x86 --cargo 'rustup run 1.98.1 cargo' --rustc 'rustup run 1.98.1 rustc' --cc clang-18 --isolate
      - name: Preserve source-only build and isolated runtime evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: owned-fsl-pipeline
          path: artifacts/owned-pipeline.json
          if-no-files-found: ignore

  quantum-reference:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Fetch pinned canonical FIR compiler without legacy assets
        run: |
          git init .quantum-compiler
          git -C .quantum-compiler remote add origin https://github.com/fission-systems/Fission.git
          git -C .quantum-compiler sparse-checkout init --cone
          git -C .quantum-compiler sparse-checkout set crates .cargo
          git -C .quantum-compiler fetch --depth=1 --filter=blob:none origin 1f5e4c5b0aa10f7fba29587699906e42dfc3878c
          git -C .quantum-compiler checkout --detach FETCH_HEAD
          test ! -e .quantum-compiler/utils
          test ! -e .quantum-compiler/vendor
          cmp experiments/quantum/ideal-circuits/circuits.fsl .quantum-compiler/crates/fission-fsl/specs/quantum-circuits.fsl
      - name: Build and check the quantum FIR contract
        run: |
          rustup toolchain install 1.98.1 --profile minimal --no-self-update
          cargo +1.98.1 build --manifest-path .quantum-compiler/Cargo.toml --locked -p fission-fsl --bin fslc
          cargo +1.98.1 test --manifest-path .quantum-compiler/Cargo.toml --locked -p fission-fsl --test quantum
          python3 -m unittest discover -s tests -p test_quantum_validate.py -v
      - name: Compare conditional states against dense matrix and Kraus oracle
        run: python3 tools/quantum_validate.py --fslc .quantum-compiler/target/debug/fslc --compiler-root .quantum-compiler
      - name: Preserve bounded quantum reference evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: quantum-reference
          path: artifacts/quantum.json
          if-no-files-found: ignore

  quantum-channels-cfg:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Fetch pinned canonical FIR compiler without legacy assets
        run: |
          git init .quantum-compiler
          git -C .quantum-compiler remote add origin https://github.com/fission-systems/Fission.git
          git -C .quantum-compiler sparse-checkout init --cone
          git -C .quantum-compiler sparse-checkout set crates .cargo
          git -C .quantum-compiler fetch --depth=1 --filter=blob:none origin 1fe65569e84e92bd6fd7d1a3b4772580ac8da975
          git -C .quantum-compiler checkout --detach FETCH_HEAD
          test ! -e .quantum-compiler/utils
          test ! -e .quantum-compiler/vendor
