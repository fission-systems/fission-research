        run: |
          rustup toolchain install 1.98.1 --profile minimal --no-self-update
          cargo +1.98.1 build --manifest-path .fabric-compiler/Cargo.toml --locked -p fission-fsl --bin fslc
          cargo +1.98.1 test --manifest-path .fabric-compiler/Cargo.toml --locked -p fission-fsl --test fabric
