name: Research reproduction
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  historical-artifacts:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Fetch pinned SLA input corpus
        run: |
          git init Fission
          git -C Fission remote add origin https://github.com/fission-systems/Fission.git
          git -C Fission sparse-checkout init --cone
          git -C Fission sparse-checkout set utils/sleigh-specs/compiled
          git -C Fission fetch --depth=1 --filter=blob:none origin 96fc71f75cecdee305faf9497561c577a8955468
          git -C Fission checkout --detach FETCH_HEAD
      - run: make test reproduce
      - name: Preserve reproduction report
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: historical-artifacts-report
          path: artifacts/reproduction.json
          if-no-files-found: ignore
  sop2-and-fir:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Fetch pinned experimental compiler
        run: |
          git init .compiler
          git -C .compiler remote add origin https://github.com/fission-systems/Fission.git
          git -C .compiler fetch --depth=1 origin bf49f27a9b8f0fdafedeba0c88a232522a39f267
          git -C .compiler checkout --detach FETCH_HEAD
      - name: Install encoding oracle
        run: sudo apt-get update && sudo apt-get install -y llvm-18 clang
      - name: Build and validate FIR execution and recompilation
        working-directory: .compiler
        run: |
          rustup toolchain install 1.98.1 --profile minimal --no-self-update
          cargo +1.98.1 build --locked -p fission-fsl --bin fslc
          cargo +1.98.1 test --locked -p fission-fsl -- --nocapture
      - name: Compare SOP2 decode and reencoding against LLVM
        run: python3 tools/gfx900_sop2_validate.py --fslc .compiler/target/debug/fslc --llvm-mc llvm-mc-18 --llvm-objdump llvm-objdump-18
      - name: Preserve SOP2 report
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: gfx900-sop2-report
          path: artifacts/gfx900-sop2.json
          if-no-files-found: ignore
